name: Bug report
description: Report a reproducible issue in tokens, patterns or documentation.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal example or catalogue URL. Use invented data only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Package version, theme and browser
      placeholder: "0.6.0, operations-dark, Chrome, 375px viewport"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or accessibility impact
      description: Remove customer data, credentials and private application details.
