name: Publish ASIG packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: asig-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browser cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify release tag and package versions
        id: release
        run: node scripts/verify-release-tag.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Validate release candidate
        run: npm run check

      - name: Run browser checks
        run: npm test

      - name: Publish design tokens with provenance
        run: npm publish --workspace=@angelstones/design-tokens --access public --provenance --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}

      - name: Publish UI patterns with provenance
        run: npm publish --workspace=@angelstones/ui-patterns --access public --provenance --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist-tag }}
