name: ASIG checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Read release version
        id: release
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Validate source and release snapshot
        run: npm run check

      - name: Run accessibility, interaction, responsive, and visual checks
        run: npm test

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload versioned distribution snapshot
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: asig-${{ steps.release.outputs.version }}-vendored-snapshot
          path: vendor/asig-${{ steps.release.outputs.version }}/
          if-no-files-found: error
